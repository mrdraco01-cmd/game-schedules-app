<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Game Schedule</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card-2: #222631;
    --text: #f2f3f5;
    --muted: #9aa1ad;
    --line: #2a2f3a;
    --accent: #5aa9ff;
    --live: #ff4d4f;
    --win: #3ccf7a;
    --loss: #ff6b6b;
    --draw: #c9a227;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }

  header {
    position: sticky; top: 0; z-index: 5;
    background: rgba(15,17,21,.92); backdrop-filter: blur(10px);
    padding: 14px 16px 10px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 20px; margin: 0; flex: 1; letter-spacing: .2px; }
  #updated { font-size: 12px; color: var(--muted); margin-top: 2px; font-weight: 400; display: block; }
  #refresh {
    border: 0; background: var(--card-2); color: var(--text);
    width: 40px; height: 40px; border-radius: 12px; font-size: 18px; cursor: pointer;
  }
  #refresh.spin span { display: inline-block; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  main { padding: 6px 12px 32px; max-width: 640px; margin: 0 auto; }
  .day { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px;
    color: var(--muted); margin: 18px 4px 8px; }
  .day.today { color: var(--accent); }

  .game {
    background: var(--card); border-radius: 16px; padding: 14px;
    margin-bottom: 10px; display: grid; grid-template-columns: 48px 1fr auto;
    gap: 4px 12px; align-items: center; border: 1px solid transparent;
  }
  .game.in { border-color: rgba(255,77,79,.5); }
  .logo { width: 48px; height: 48px; border-radius: 12px; background: #fff1;
    display: grid; place-items: center; overflow: hidden; grid-row: span 2; }
  .logo img { width: 40px; height: 40px; object-fit: contain; }
  .logo .fb { font-weight: 800; font-size: 14px; color: var(--muted); }
  .team { font-weight: 700; font-size: 16px; line-height: 1.2; }
  .matchup { color: var(--muted); font-size: 15px; display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .matchup img { width: 18px; height: 18px; object-fit: contain; }
  .time { text-align: right; font-weight: 700; font-size: 16px; white-space: nowrap; grid-row: span 2; align-self: start; }
  .time small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); margin-top: 3px; }
  .meta { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { font-size: 12px; padding: 4px 9px; border-radius: 999px; background: var(--card-2); color: var(--muted); }
  .chip.watch { color: var(--text); }
  .chip.home { color: #8fd3a6; }
  .chip.away { color: #f0b36b; }

  .status { grid-column: 1 / 4; display: flex; align-items: center; gap: 10px;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .badge { font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 8px; background: var(--card-2); }
  .badge.live { background: var(--live); color: #fff; }
  .badge.live::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #fff; margin-right: 6px; vertical-align: 1px; animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .reveal { margin-left: auto; border: 1px dashed #4a5263; background: none; color: var(--muted);
    font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 10px; cursor: pointer; }
  .score { margin-left: auto; font-weight: 800; font-size: 18px; letter-spacing: .5px;
    background: none; border: 0; color: var(--text); cursor: pointer; font-family: inherit; }
  .score .r { font-size: 13px; padding: 2px 7px; border-radius: 6px; margin-left: 8px; vertical-align: 2px; }
  .r.W { background: rgba(60,207,122,.18); color: var(--win); }
  .r.L { background: rgba(255,107,107,.18); color: var(--loss); }
  .r.D { background: rgba(201,162,39,.18); color: var(--draw); }

  .msg { text-align: center; color: var(--muted); padding: 40px 16px; font-size: 15px; }
  .banner { background: #3a2a12; color: #f3c77a; font-size: 13px; padding: 8px 12px;
    border-radius: 10px; margin: 12px 0 0; }
  .hbtn { border: 0; background: var(--card-2); color: var(--text); height: 40px; padding: 0 14px;
    border-radius: 12px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }

  /* ---- Manage teams sheet ---- */
  .sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: none; flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  .sheet.open { display: flex; }
  .sheet-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  .sheet-head h2 { font-size: 20px; margin: 0; flex: 1; }
  .sheet-head .back { background: none; border: 0; color: var(--accent); font: inherit; font-size: 15px; padding: 8px 4px; cursor: pointer; }
  .sheet-head .done { background: var(--accent); color: #fff; }
  .sheet-body { flex: 1; overflow-y: auto; padding: 12px 12px 32px; }
  .trow { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 14px;
    padding: 10px 12px; margin-bottom: 8px; }
  .trow .logo { width: 40px; height: 40px; grid-row: auto; border-radius: 10px; }
  .trow .logo img { width: 32px; height: 32px; }
  .trow .tname { flex: 1; min-width: 0; }
  .trow .tname b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trow .tname small { color: var(--muted); font-size: 12px; }
  .rm { border: 0; background: rgba(255,107,107,.14); color: var(--loss); font: inherit; font-size: 13px;
    font-weight: 600; padding: 8px 12px; border-radius: 10px; cursor: pointer; }
  .add { border: 0; background: rgba(90,169,255,.16); color: var(--accent); font: inherit; font-size: 13px;
    font-weight: 600; padding: 8px 14px; border-radius: 10px; cursor: pointer; }
  .add.added { background: var(--card-2); color: var(--muted); }
  .bigadd { width: 100%; border: 1px dashed #4a5263; background: none; color: var(--accent); font: inherit;
    font-size: 15px; font-weight: 600; padding: 14px; border-radius: 14px; margin-top: 6px; cursor: pointer; }
  .leagues { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 12px; scrollbar-width: none; }
  .leagues::-webkit-scrollbar { display: none; }
  .lchip { flex: none; border: 0; background: var(--card-2); color: var(--muted); font: inherit; font-size: 13px;
    padding: 8px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .lchip.on { background: var(--accent); color: #fff; font-weight: 600; }
  .search { width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); color: var(--text); margin-bottom: 12px; outline: none; }
  .search:focus { border-color: var(--accent); }
  .hint { color: var(--muted); font-size: 13px; margin: 2px 4px 12px; }

  /* ---- Team schedule screen ---- */
  .tlink { cursor: pointer; }
  .tlink:active { opacity: .7; }
  .team.tlink::after { content: " ›"; color: var(--muted); font-weight: 400; }
  .thead { display: flex; align-items: center; gap: 12px; padding: 4px 4px 12px; }
  .thead .logo { width: 56px; height: 56px; grid-row: auto; }
  .thead .logo img { width: 46px; height: 46px; }
  .thead h3 { margin: 0; font-size: 19px; }
  .thead small { color: var(--muted); font-size: 13px; display: block; margin-top: 3px; }
  .rec { border: 1px dashed #4a5263; background: none; color: var(--muted); font: inherit; font-size: 12px;
    padding: 3px 8px; border-radius: 8px; margin-top: 6px; cursor: pointer; }
  .rec.shown { border-style: solid; color: var(--text); }
  .tools { display: flex; gap: 8px; margin: 0 4px 10px; }
  .tools .hbtn { height: 34px; font-size: 13px; }
  .tools .hbtn.on { background: var(--accent); color: #fff; }
  .srow { display: grid; grid-template-columns: 50px 1fr auto; gap: 10px; align-items: center;
    background: var(--card); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; border: 1px solid transparent; }
  .srow.in { border-color: rgba(255,77,79,.5); }
  .srow.next { border-color: rgba(90,169,255,.5); }
  .srow.post { opacity: .92; }
  .sdate { text-align: center; line-height: 1.15; }
  .sdate b { display: block; font-size: 15px; }
  .sdate span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .sopp { min-width: 0; }
  .sopp .o { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 15px; }
  .sopp .o img { width: 22px; height: 22px; object-fit: contain; flex: none; }
  .sopp .o span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sopp small { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
  .sright { text-align: right; font-size: 14px; font-weight: 600; white-space: nowrap; }
  .sright small { display: block; color: var(--muted); font-weight: 500; font-size: 11px; margin-top: 2px; }
  .sright .reveal, .sright .score { margin: 0; }
  .sright .score { font-size: 16px; }
  .sright .badge { display: inline-block; margin-bottom: 4px; }
  .tagchip { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: #c8b6ff;
    background: rgba(160,130,255,.14); padding: 2px 6px; border-radius: 6px; margin-left: 6px; vertical-align: 1px; }
  .sec { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 16px 4px 8px; }

  /* ---- Watch / Highlights buttons ---- */
  .acts { grid-column: 1 / 4; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .act { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-size: 13px; font-weight: 600;
    padding: 7px 12px; border-radius: 10px; background: rgba(90,169,255,.14); color: var(--accent); }
  .act.hl { background: rgba(255,77,79,.14); color: #ff7b7d; }
  .sacts { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  .sacts .act { font-size: 12px; padding: 5px 10px; }
  .hlset { display: block; background: none; border: 0; padding: 0; margin-top: 4px; color: var(--accent);
    font: inherit; font-size: 12px; cursor: pointer; text-align: left; }
  .hledit { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .hledit input { flex: 1 1 140px; min-width: 0; font: inherit; font-size: 15px; padding: 8px 10px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .hledit button { border: 0; border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    background: var(--card-2); color: var(--text); }
  .hledit button.save { background: var(--accent); color: #fff; }
  .trow.editing { flex-wrap: wrap; }
  .trow.editing .hledit { flex-basis: 100%; }

  .skeleton { height: 96px; border-radius: 16px; margin-bottom: 10px;
    background: linear-gradient(90deg, var(--card) 0%, var(--card-2) 50%, var(--card) 100%);
    background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
</style>
</head>
<body>
<header>
  <h1>Game Schedule <span id="updated">Loading…</span></h1>
  <button id="teamsBtn" class="hbtn">Teams</button>
  <button id="refresh" aria-label="Refresh"><span>↻</span></button>
</header>
<main id="list">
  <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
</main>

<!-- Manage teams -->
<section id="sheet" class="sheet" aria-modal="true" role="dialog">
  <div class="sheet-head">
    <button id="sheetBack" class="back" hidden>‹ Back</button>
    <h2 id="sheetTitle">My Teams</h2>
    <button id="sheetDone" class="hbtn done">Done</button>
  </div>
  <div id="sheetBody" class="sheet-body"></div>
</section>

<!-- One team's full schedule -->
<section id="teamSheet" class="sheet" aria-modal="true" role="dialog">
  <div class="sheet-head">
    <button id="teamBack" class="back">‹ Back</button>
    <h2>Schedule</h2>
    <button id="teamRefresh" class="hbtn" aria-label="Refresh">↻</button>
  </div>
  <div id="teamBody" class="sheet-body"></div>
</section>

<script>
// ===== Settings =====
const API = "https://game-schedule.mrdraco01.workers.dev/";
const REFRESH_MINUTES = 5;
const LIVE_REFRESH_SECONDS = 60;
// =====================

const list = document.getElementById("list");
const updatedEl = document.getElementById("updated");
const refreshBtn = document.getElementById("refresh");

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? (JSON.parse(v) ?? d) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let revealed = new Set(store.get("revealed", []));

// ===== My teams (saved on this phone) =====
const logoUrl = (path) => `https://a.espncdn.com/combiner/i?img=/i/teamlogos/${path}.png&h=96&w=96`;
const DEFAULT_TEAMS = [
  { league: "cfb",  id: 252,    name: "BYU Football",       logo: logoUrl("ncaa/500/252") },
  { league: "wsoc", id: 20516,  name: "BYU Women's Soccer", logo: logoUrl("ncaa/500/252") },
  { league: "nhl",  id: 129764, name: "Utah Mammoth",       logo: logoUrl("nhl/500/uta") },
  { league: "nwsl", id: 19141,  name: "Utah Royals",        logo: logoUrl("soccer/500/19141") },
  { league: "mls",  id: 4771,   name: "Real Salt Lake",     logo: logoUrl("soccer/500/4771") },
  { league: "nba",  id: 26,     name: "Utah Jazz",          logo: logoUrl("nba/500/utah") },
];
// New installs start with no teams. A phone that already used the app
// (before team lists were saved) keeps the original six.
let myTeams = store.get("myTeams", null);
if (!myTeams) {
  myTeams = store.get("lastData", null) ? DEFAULT_TEAMS : [];
  store.set("myTeams", myTeams);
}
const saveTeams = () => store.set("myTeams", myTeams);

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const gameKey = (g) => `${g.team}|${g.iso}`;
const initials = (name) => name.split(/\s+/).map((w) => w[0]).join("").slice(0, 3).toUpperCase();

function dayLabel(d) {
  const k = (x) => x.toLocaleDateString("en-CA");
  const now = new Date();
  const tom = new Date(now); tom.setDate(now.getDate() + 1);
  const yest = new Date(now); yest.setDate(now.getDate() - 1);
  if (k(d) === k(now)) return "Today";
  if (k(d) === k(tom)) return "Tomorrow";
  if (k(d) === k(yest)) return "Yesterday";
  return d.toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric" });
}
function timeLabel(g, d) {
  if (g.time === "TBD") return "TBD";
  return d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
}

// ===== Watch & highlights links =====
const LEAGUE_HL = { nfl: "@NFL", nba: "@NBA", wnba: "@WNBA", nhl: "@NHL", mlb: "@MLB", mls: "@MLS", nwsl: "@NWSLsoccer", epl: "@NBCSports" };
const teamFor = (g) => myTeams.find((t) => t.name === g.team);
function highlightsUrl(g) {
  if (!g.hl) return "";
  const own = teamFor(g)?.hl;                       // undefined = league default, "" = plain YouTube search
  const channel = own === undefined ? g.hl.channel : own;
  return channel
    ? `https://www.youtube.com/${channel}/search?query=${encodeURIComponent(g.hl.query)}`
    : `https://www.youtube.com/results?search_query=${encodeURIComponent(g.hl.search)}`;
}
// ----- Open the streaming app installed on the phone -----
// Android: an "intent" link launches the app (falls back to the website if it isn't installed).
// iPhone/Mac: the normal https link, which iOS hands to the app when it's installed.
const IS_ANDROID = /Android/i.test(navigator.userAgent);
const APPS = [
  { test: /espn\.com/i,            pkg: "com.espn.score_center" },
  { test: /disneyplus\.com/i,      pkg: "com.disney.disneyplus" },
  { test: /tv\.apple\.com/i,       pkg: "com.apple.atve.androidtv.appletv" },
  { test: /netflix\.com/i,         pkg: "com.netflix.mediaclient" },
  { test: /primevideo\.com|amazon\.com\/gp\/video/i, pkg: "com.amazon.avod.thirdpartyclient" },
  { test: /hbomax\.com/i,          pkg: "com.wbd.stream" },
  { test: /paramountplus\.com/i,   pkg: "com.cbs.app" },
  { test: /peacocktv\.com/i,       pkg: "com.peacocktv.peacockandroid" },
  { test: /foxsports\.com/i,       pkg: "com.foxsports.android" },
  { test: /youtube\.com/i,         pkg: "com.google.android.youtube" },
];
// Better app-friendly addresses for a few services
const APP_URLS = { "https://www.hbomax.com/": "https://play.hbomax.com/",
  "https://www.amazon.com/gp/video/storefront": "https://www.primevideo.com/" };
let espnApp = store.get("espnApp", "espn"); // "espn" or "disney"

function appHref(url) {
  url = APP_URLS[url] || url;
  const app = APPS.find((a) => a.test.test(url));
  if (!IS_ANDROID || !app) return { href: url, newTab: true };
  const u = new URL(url);
  return { href: `intent://${u.host}${u.pathname}${u.search}#Intent;scheme=https;package=${app.pkg};`
    + `S.browser_fallback_url=${encodeURIComponent(url)};end`, newTab: false };
}
function watchTarget(l) {
  const isEspn = /espn\.com/i.test(l.url);
  if (isEspn && espnApp === "disney") return { label: `Disney+ (${l.label})`, url: "https://www.disneyplus.com/" };
  return l;
}

const linkBtn = (url, text, cls = "") => {
  const { href, newTab } = appHref(url);
  return `<a class="act ${cls}" href="${esc(href)}" ${newTab ? 'target="_blank" rel="noopener"' : ""}>${text}</a>`;
};
function actionButtons(g) {
  if (g.state === "post") {
    const u = highlightsUrl(g);
    return u ? linkBtn(u, "▶ Highlights", "hl") : "";
  }
  return (g.watchLinks || []).map(watchTarget).map((l) => linkBtn(l.url, `📺 Watch · ${esc(l.label)}`)).join("");
}

function render(data, stale) {
  const games = (data && data.games) || [];
  if (!games.length) {
    list.innerHTML = `<div class="msg">No upcoming games found.</div>`;
    return;
  }
  let html = stale ? `<div class="banner">Offline — showing the last schedule saved on this phone.</div>` : "";
  let lastDay = "";
  for (const g of games) {
    const d = new Date(g.iso);
    const day = dayLabel(d);
    if (day !== lastDay) {
      html += `<div class="day ${day === "Today" ? "today" : ""}">${esc(day)}</div>`;
      lastDay = day;
    }
    const key = gameKey(g);
    const ha = (g.homeAway || "").toLowerCase();
    const logo = g.logo
      ? `<img src="${esc(g.logo)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'fb',textContent:'${esc(initials(g.team))}'}))">`
      : `<span class="fb">${esc(initials(g.team))}</span>`;
    const oppLogo = g.oppLogo ? `<img src="${esc(g.oppLogo)}" alt="" loading="lazy" onerror="this.remove()">` : "";

    let status = "";
    if (g.state === "in" || g.state === "post") {
      const badge = g.state === "in"
        ? `<span class="badge live">${esc((g.status || "LIVE").replace(/^LIVE · /, "LIVE "))}</span>`
        : `<span class="badge">${esc(g.status || "Final")}</span>`;
      let right = "";
      if (g.score) {
        right = revealed.has(key)
          ? `<button class="score" data-key="${esc(key)}" aria-label="Hide score">${esc(g.score)}${g.result ? `<span class="r ${esc(g.result)}">${esc(g.result)}</span>` : ""}</button>`
          : `<button class="reveal" data-key="${esc(key)}">Tap to reveal score</button>`;
      }
      status = `<div class="status">${badge}${right}</div>`;
    }

    const ti = myTeams.findIndex((t) => t.name === g.team);
    html += `
      <article class="game ${esc(g.state)}">
        <div class="logo ${ti >= 0 ? "tlink" : ""}" ${ti >= 0 ? `data-team="${ti}"` : ""}>${logo}</div>
        <div class="team ${ti >= 0 ? "tlink" : ""}" ${ti >= 0 ? `data-team="${ti}"` : ""}>${esc(g.team)}</div>
        <div class="time">${esc(timeLabel(g, d))}<small>${esc(g.homeAway)}</small></div>
        <div class="matchup">${g.matchup?.startsWith("@") ? "@" : "vs"} ${oppLogo}<span>${esc(g.opponent)}</span></div>
        <div class="meta">
          <span class="chip watch">📺 ${esc(g.watch)}</span>
          <span class="chip ${ha}">${esc(g.homeAway)}</span>
        </div>
        ${status}
        ${(() => { const a = actionButtons(g); return a ? `<div class="acts">${a}</div>` : ""; })()}
      </article>`;
  }
  list.innerHTML = html;
}

function setUpdated(text) { updatedEl.textContent = text; }

async function load() {
  if (!myTeams.length) {
    list.innerHTML = `<div class="msg"><b style="color:var(--text);font-size:18px">Welcome!</b><br><br>
      Add the teams you follow to see when they play, how to watch, and scores — hidden until you tap.<br><br>
      <button class="bigadd" onclick="openSheet(true)">+ Add your teams</button></div>`;
    setUpdated("");
    return;
  }
  refreshBtn.classList.add("spin");
  try {
    // One request per team keeps each request under Cloudflare's free-plan limit,
    // so live scores don't get dropped when several teams play at once.
    const prev = store.get("lastData", { games: [] });
    const results = await Promise.all(myTeams.map(async (t) => {
      try {
        const r = await fetch(API + "?t=" + encodeURIComponent(`${t.league}~${t.id}~${t.name}`), { cache: "no-store" });
        if (!r.ok) throw new Error(r.status);
        return { team: t, data: await r.json() };
      } catch { return { team: t, failed: true }; }
    }));
    if (results.every((x) => x.failed)) throw new Error("offline");
    // Keep the last known games for any team whose request failed
    const games = results.flatMap((x) => x.failed
      ? (prev.games || []).filter((g) => g.team === x.team.name)
      : (x.data.games || []));
    const data = { live: results.some((x) => x.data?.live), soon: results.some((x) => x.data?.soon), games: pickGames(games) };
    store.set("lastData", data);
    pruneRevealed();
    render(data, false);
    const partial = results.some((x) => x.failed) ? " · some teams couldn't update" : "";
    setUpdated((data.live ? "Live · updated " : "Updated ") + new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) + partial);
    isLive = data.live || data.soon || games.some(aboutToStart);
  } catch (e) {
    const cached = store.get("lastData", null);
    if (cached) { render(cached, true); setUpdated("Offline"); }
    else { list.innerHTML = `<div class="msg">Couldn't load the schedule. Check your connection and tap ↻.</div>`; setUpdated("Error"); }
  } finally {
    refreshBtn.classList.remove("spin");
    scheduleNext();
  }
}

// Combine every team's games: the next MAX_ROWS games in time order, plus each team's next game
const MAX_ROWS = 12;
function pickGames(all) {
  const seen = new Set();
  const games = all.filter((g) => { const k = gameKey(g); if (seen.has(k)) return false; seen.add(k); return true; })
    .sort((a, b) => Date.parse(a.iso) - Date.parse(b.iso));
  const picked = new Set(games.slice(0, MAX_ROWS));
  for (const t of myTeams) {
    const next = games.find((g) => g.team === t.name && g.state !== "post");
    if (next) picked.add(next);
  }
  return games.filter((g) => picked.has(g));
}
// Starts within 15 minutes, or should have started but isn't marked live yet
function aboutToStart(g) {
  if (g.state !== "pre" || g.time === "TBD") return false;
  const t = Date.parse(g.iso), now = Date.now();
  return t - now < 15 * 60e3 && now - t < 4 * 3600e3;
}

// Forget revealed scores for games more than 60 days old
function pruneRevealed() {
  const cutoff = Date.now() - 60 * 864e5;
  revealed = new Set([...revealed].filter((k) => new Date(k.split("|").pop()).getTime() > cutoff));
  store.set("revealed", [...revealed]);
}

// Refresh every minute while a game is live, otherwise every 5 minutes
let isLive = false, nextTimer = null;
function scheduleNext() {
  clearTimeout(nextTimer);
  const live = isLive || (teamSheet.classList.contains("open") && (teamData?.live || (teamData?.games || []).some(aboutToStart)));
  nextTimer = setTimeout(() => {
    if (document.hidden) return scheduleNext();
    load();
    if (teamSheet.classList.contains("open")) loadTeam(false);
  }, (live ? LIVE_REFRESH_SECONDS : REFRESH_MINUTES * 60) * 1000);
}

list.addEventListener("click", (e) => {
  const tm = e.target.closest("[data-team]");
  if (tm) { openTeam(myTeams[Number(tm.dataset.team)]); return; }
  const btn = e.target.closest("[data-key]");
  if (!btn) return;
  const k = btn.dataset.key;
  revealed.has(k) ? revealed.delete(k) : revealed.add(k);
  store.set("revealed", [...revealed]);
  render(store.get("lastData", { games: [] }), false);
});
refreshBtn.addEventListener("click", load);

// ===== Manage teams screen =====
const sheet = document.getElementById("sheet");
const sheetBody = document.getElementById("sheetBody");
const sheetTitle = document.getElementById("sheetTitle");
const sheetBack = document.getElementById("sheetBack");
let leagues = null;          // [{key, name}]
const leagueTeamsCache = {}; // league -> [{id, name, full, logo}]
let currentLeague = "all";
const searchCache = {};      // query -> results from /search
let searchTimer = null;
let teamsChanged = false;

const leagueName = (key) => (leagues || []).find((l) => l.key === key)?.name || key.toUpperCase();
const isMine = (league, id) => myTeams.some((t) => t.league === league && Number(t.id) === Number(id));
const logoBox = (t) => `<div class="logo">${t.logo
  ? `<img src="${esc(t.logo)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'fb',textContent:'${esc(initials(t.name))}'}))">`
  : `<span class="fb">${esc(initials(t.name))}</span>`}</div>`;

async function getLeagues() {
  if (leagues) return leagues;
  const r = await fetch(API + "leagues");
  leagues = (await r.json()).leagues;
  return leagues;
}

function openSheet(goToAdd) {
  teamsChanged = false;
  sheet.classList.add("open");
  if (goToAdd === true) { showAddTeam(); return; }
  showMyTeams();
  getLeagues().then(() => { if (sheetTitle.textContent === "My Teams") showMyTeams(); }).catch(() => {});
}
function closeSheet() {
  sheet.classList.remove("open");
  if (teamsChanged) { store.set("lastData", null); list.innerHTML = `<div class="skeleton"></div><div class="skeleton"></div>`; load(); }
}

let editingHl = -1;
function hlLabel(t) {
  if (t.hl === undefined) return LEAGUE_HL[t.league] || ([660, 2765].includes(Number(t.id)) && t.league.startsWith("intl") ? "@ussoccer" : "YouTube search");
  return t.hl || "YouTube search";
}
// Accept "@handle", "handle" or a full youtube.com/@handle link
function cleanHandle(v) {
  const m = String(v || "").trim().match(/@[\w.\-]+/);
  if (m) return m[0];
  const plain = String(v || "").trim().replace(/^https?:\/\/\S*youtube\.com\//i, "").replace(/\/.*$/, "");
  return /^[\w.\-]{3,}$/.test(plain) ? "@" + plain : "";
}
function setHl(i, value) {
  if (value === undefined) delete myTeams[i].hl; else myTeams[i].hl = value;
  saveTeams(); editingHl = -1; showMyTeams();
  render(store.get("lastData", { games: [] }), false);
}

function showMyTeams() {
  sheetTitle.textContent = "My Teams";
  sheetBack.hidden = true;
  sheetBody.innerHTML = `
    <p class="hint">${myTeams.length} team${myTeams.length === 1 ? "" : "s"} · saved on this phone</p>
    ${myTeams.map((t, i) => `
      <div class="trow ${editingHl === i ? "editing" : ""}">
        ${logoBox(t)}
        <div class="tname"><div class="tlink" data-open="${i}"><b>${esc(t.name)}</b><small>${esc(leagueName(t.league))} · tap for schedule</small></div>
          <button class="hlset" data-hl="${i}">▶ Highlights: ${esc(hlLabel(t))} ✎</button></div>
        <button class="rm" data-remove="${i}">Remove</button>
        ${editingHl === i ? `<div class="hledit">
          <input id="hlInput" placeholder="@channel (e.g. @BYUCougars)" value="${esc(t.hl || "")}" autocomplete="off" autocapitalize="off">
          <button class="save" data-hlsave="${i}">Save</button>
          <button data-hlsearch="${i}">YouTube search</button>
          <button data-hldefault="${i}">Default</button></div>` : ""}
      </div>`).join("")}
    <button class="bigadd" id="addTeamBtn">+ Add team</button>
    <div class="sec" style="margin-top:24px">Watch settings</div>
    <div class="trow" style="flex-wrap:wrap">
      <div class="tname"><b>ESPN, ESPN+ &amp; ABC games open in</b><small>Saved on this phone</small></div>
      <div class="tools" style="margin:6px 0 0;flex-basis:100%">
        <button class="hbtn ${espnApp === "espn" ? "on" : ""}" data-espnapp="espn">ESPN app</button>
        <button class="hbtn ${espnApp === "disney" ? "on" : ""}" data-espnapp="disney">Disney+</button>
      </div>
    </div>`;
}

async function showAddTeam() {
  sheetTitle.textContent = "Add Team";
  sheetBack.hidden = false;
  sheetBody.innerHTML = `<div class="skeleton" style="height:40px"></div><div class="skeleton"></div>`;
  try { await getLeagues(); } catch { sheetBody.innerHTML = `<div class="msg">Couldn't load leagues. Check your connection.</div>`; return; }
  currentLeague = "all";
  const chips = [{ key: "all", name: "🔍 Search all" }, ...leagues];
  sheetBody.innerHTML = `
    <div class="leagues">${chips.map((l) => `<button class="lchip ${l.key === currentLeague ? "on" : ""}" data-league="${l.key}">${esc(l.name)}</button>`).join("")}</div>
    <input id="teamSearch" class="search" type="search" placeholder="Search any team, school or city…" autocomplete="off">
    <div id="results"></div>`;
  const input = document.getElementById("teamSearch");
  input.addEventListener("input", renderResults);
  loadLeague("all");
  input.focus();
}

async function loadLeague(key) {
  currentLeague = key;
  sheetBody.querySelectorAll(".lchip").forEach((c) => c.classList.toggle("on", c.dataset.league === key));
  const input = document.getElementById("teamSearch");
  if (input) input.placeholder = key === "all" ? "Search any team, school or city…" : `Search ${leagueName(key)}…`;
  const res = document.getElementById("results");
  if (key === "all") { renderResults(); return; }
  if (!leagueTeamsCache[key]) {
    res.innerHTML = `<div class="skeleton"></div><div class="skeleton"></div>`;
    try {
      const r = await fetch(API + "teams?league=" + encodeURIComponent(key));
      leagueTeamsCache[key] = (await r.json()).teams || [];
    } catch { res.innerHTML = `<div class="msg">Couldn't load teams. Check your connection.</div>`; return; }
  }
  if (currentLeague === key) renderResults();
}

const teamRow = (t, league, sub) => {
  const mine = isMine(league, t.id);
  return `<div class="trow">
    ${logoBox(t)}
    <div class="tname"><b>${esc(t.name)}</b><small>${esc(sub)}</small></div>
    <button class="add ${mine ? "added" : ""}" data-add="${esc(league)}~${t.id}" ${mine ? "disabled" : ""}>${mine ? "Added ✓" : "Add"}</button>
  </div>`;
};

function renderSearchAll() {
  const res = document.getElementById("results");
  const q = document.getElementById("teamSearch").value.trim();
  clearTimeout(searchTimer);
  if (q.length < 2) {
    res.innerHTML = `<p class="hint">Type a team, school or city — for example <b>BYU</b>, <b>Jazz</b>, <b>Utah Valley</b> or <b>United States</b>. Add a sport to narrow it down, like <b>BYU soccer</b>.</p>`;
    return;
  }
  const key = q.toLowerCase();
  const show = (data) => {
    if (document.getElementById("teamSearch")?.value.trim().toLowerCase() !== key || currentLeague !== "all") return;
    const rows = data.results || [];
    res.innerHTML = rows.map((t) => teamRow(t, t.league, t.leagueName)).join("")
      + (data.total > rows.length ? `<p class="hint">Showing ${rows.length} of ${data.total} — add more words to narrow it down.</p>` : "")
      + (!rows.length ? `<div class="msg">No teams match "${esc(q)}".</div>` : "");
  };
  if (searchCache[key]) { show(searchCache[key]); return; }
  res.innerHTML = `<div class="skeleton" style="height:60px"></div><div class="skeleton" style="height:60px"></div>`;
  searchTimer = setTimeout(async () => {
    try {
      const r = await fetch(API + "search?q=" + encodeURIComponent(q));
      searchCache[key] = await r.json();
      show(searchCache[key]);
    } catch { res.innerHTML = `<div class="msg">Couldn't search right now. Check your connection.</div>`; }
  }, 300);
}

function renderResults() {
  if (currentLeague === "all") return renderSearchAll();
  const res = document.getElementById("results");
  const all = leagueTeamsCache[currentLeague];
  if (!res || !all) return;
  const q = document.getElementById("teamSearch").value.trim().toLowerCase();
  const matches = all.filter((t) => !q || t.name.toLowerCase().includes(q) || t.full.toLowerCase().includes(q)
    || (t.abbr || "").toLowerCase() === q);
  const shown = matches.slice(0, 60);
  res.innerHTML = shown.map((t) => teamRow(t, currentLeague, t.full)).join("") + (matches.length > shown.length ? `<p class="hint">Showing ${shown.length} of ${matches.length} — type to narrow it down.</p>` : "")
    + (!matches.length ? `<div class="msg">No teams match "${esc(q)}".</div>` : "");
}

sheet.addEventListener("click", (e) => {
  const rm = e.target.closest("[data-remove]");
  if (rm) { myTeams.splice(Number(rm.dataset.remove), 1); saveTeams(); teamsChanged = true; editingHl = -1; showMyTeams(); return; }
  const ea = e.target.closest("[data-espnapp]");
  if (ea) {
    espnApp = ea.dataset.espnapp; store.set("espnApp", espnApp); showMyTeams();
    render(store.get("lastData", { games: [] }), false);
    return;
  }
  const hb = e.target.closest("[data-hl]");
  if (hb) { const i = Number(hb.dataset.hl); editingHl = editingHl === i ? -1 : i; showMyTeams(); document.getElementById("hlInput")?.focus(); return; }
  const hs = e.target.closest("[data-hlsave]");
  if (hs) {
    const v = cleanHandle(document.getElementById("hlInput").value);
    setHl(Number(hs.dataset.hlsave), v || undefined);
    return;
  }
  const hq = e.target.closest("[data-hlsearch]");
  if (hq) { setHl(Number(hq.dataset.hlsearch), ""); return; }
  const hd = e.target.closest("[data-hldefault]");
  if (hd) { setHl(Number(hd.dataset.hldefault), undefined); return; }
  const op = e.target.closest("[data-open]");
  if (op) { openTeam(myTeams[Number(op.dataset.open)]); return; }
  if (e.target.closest("#addTeamBtn")) { showAddTeam(); return; }
  const lc = e.target.closest("[data-league]");
  if (lc) { loadLeague(lc.dataset.league); return; }
  const add = e.target.closest("[data-add]");
  if (add) {
    const [league, id] = add.dataset.add.split("~");
    const pool = currentLeague === "all"
      ? Object.values(searchCache).flatMap((d) => d.results || []).filter((x) => x.league === league)
      : leagueTeamsCache[league] || [];
    const t = pool.find((x) => String(x.id) === id);
    if (t && !isMine(league, t.id)) {
      myTeams.push({ league, id: t.id, name: t.name, logo: t.logo });
      saveTeams(); teamsChanged = true;
      add.textContent = "Added ✓"; add.classList.add("added"); add.disabled = true;
    }
  }
});
sheet.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.id === "hlInput") document.querySelector("[data-hlsave]")?.click();
});
sheetBack.addEventListener("click", showMyTeams);
document.getElementById("sheetDone").addEventListener("click", closeSheet);
document.getElementById("teamsBtn").addEventListener("click", openSheet);
window.openSheet = openSheet;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  load();
  if (teamSheet.classList.contains("open")) loadTeam(false);
});

// ===== One team's full schedule =====
const teamSheet = document.getElementById("teamSheet");
const teamBody = document.getElementById("teamBody");
let currentTeam = null, teamData = null, teamShowAll = false, teamShowRecord = false;

function openTeam(t) {
  if (!t) return;
  currentTeam = t; teamData = null; teamShowAll = false; teamShowRecord = false;
  teamSheet.classList.add("open");
  teamBody.innerHTML = `${teamHeader()}<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>`;
  loadTeam(true);
}
function closeTeam() { teamSheet.classList.remove("open"); currentTeam = null; scheduleNext(); }

async function loadTeam(scrollToNext) {
  const t = currentTeam;
  if (!t) return;
  try {
    const r = await fetch(API + "team?t=" + encodeURIComponent(`${t.league}~${t.id}~${t.name}`), { cache: "no-store" });
    const data = await r.json();
    if (!r.ok || data.error) throw new Error(data.error || r.status);
    if (currentTeam !== t) return;
    teamData = data;
    store.set("team:" + t.league + ":" + t.id, data);
    renderTeam(scrollToNext);
  } catch {
    if (currentTeam !== t) return;
    const cached = store.get("team:" + t.league + ":" + t.id, null);
    if (cached) { teamData = cached; renderTeam(scrollToNext, true); }
    else teamBody.innerHTML = `${teamHeader()}<div class="msg">Couldn't load this schedule. Check your connection and tap ↻.</div>`;
  }
  scheduleNext();
}

function teamHeader() {
  const t = currentTeam, info = teamData?.team || {};
  const sub = [info.leagueName].filter(Boolean).join(" · ");
  let rec = "";
  if (info.record || info.standing) {
    const text = [info.record, info.standing].filter(Boolean).join(" · ");
    rec = teamShowRecord
      ? `<button class="rec shown" data-rec>${esc(text)}</button>`
      : `<button class="rec" data-rec>Record hidden · tap to show</button>`;
  }
  return `<div class="thead">${logoBox({ name: t.name, logo: info.logo || t.logo })}
    <div><h3>${esc(t.name)}</h3><small>${esc(sub)}</small>${rec}</div></div>`;
}

function renderTeam(scrollToNext, stale) {
  const games = teamData?.games || [];
  const now = Date.now();
  const nextIdx = games.findIndex((g) => g.state !== "post");
  let html = teamHeader();
  html += stale ? `<div class="banner" style="margin:0 4px 10px">Offline — showing the last saved schedule.</div>` : "";
  html += `<div class="tools">
    <button class="hbtn ${teamShowAll ? "on" : ""}" data-showall>${teamShowAll ? "Hide all scores" : "Show all scores"}</button>
    <button class="hbtn" data-jump>Jump to next game</button></div>`;
  if (!games.length) html += `<div class="msg">No games found for this season yet.</div>`;
  let lastSec = "";
  games.forEach((g, i) => {
    const sec = g.state === "post" ? "Results" : g.state === "in" ? "Live now" : "Upcoming";
    if (sec !== lastSec) { html += `<div class="sec">${sec}</div>`; lastSec = sec; }
    const d = new Date(g.iso);
    const key = gameKey(g);
    const show = teamShowAll || revealed.has(key);
    const opp = g.oppLogo ? `<img src="${esc(g.oppLogo)}" alt="" loading="lazy" onerror="this.remove()">` : "";
    let right;
    if (g.state === "pre") {
      right = `${esc(timeLabel(g, d))}<small>${esc(g.watch)}</small>`;
    } else {
      const badge = g.state === "in" ? `<span class="badge live">${esc((g.status || "LIVE").replace(/^LIVE · /, "LIVE "))}</span><br>` : "";
      const sc = !g.score ? `<small>${esc(g.status || "Final")}</small>`
        : show ? `<button class="score" data-key="${esc(key)}">${esc(g.score)}${g.result ? `<span class="r ${esc(g.result)}">${esc(g.result)}</span>` : ""}</button>${g.state === "post" ? `<small>${esc(g.status || "Final")}</small>` : ""}`
        : `<button class="reveal" data-key="${esc(key)}">${g.state === "in" ? "Tap for score" : "Show score"}</button>`;
      right = badge + sc;
    }
    html += `<div class="srow ${esc(g.state)} ${i === nextIdx && g.state === "pre" ? "next" : ""}" ${i === nextIdx ? 'id="nextGame"' : ""}>
      <div class="sdate"><span>${d.toLocaleDateString("en-US", { weekday: "short" })}</span><b>${d.getMonth() + 1}/${d.getDate()}</b></div>
      <div class="sopp"><div class="o">${g.matchup?.startsWith("@") ? "@" : "vs"} ${opp}<span>${esc(g.opponent)}</span></div>
        <small>${esc(g.homeAway)}${g.tag ? `<span class="tagchip">${esc(g.tag)}</span>` : ""}</small></div>
      <div class="sright">${right}</div>
      ${(() => { const a = actionButtons(g); return a ? `<div class="sacts">${a}</div>` : ""; })()}
    </div>`;
  });
  const y = teamBody.scrollTop;
  teamBody.innerHTML = html;
  if (scrollToNext) jumpToNext(); else teamBody.scrollTop = y;
}

function jumpToNext() {
  const el = document.getElementById("nextGame");
  if (el) teamBody.scrollTop = Math.max(0, el.offsetTop - teamBody.offsetTop - 120);
}

teamBody.addEventListener("click", (e) => {
  if (e.target.closest("[data-rec]")) { teamShowRecord = !teamShowRecord; renderTeam(false); return; }
  if (e.target.closest("[data-showall]")) { teamShowAll = !teamShowAll; renderTeam(false); return; }
  if (e.target.closest("[data-jump]")) { jumpToNext(); return; }
  const btn = e.target.closest("[data-key]");
  if (!btn) return;
  const k = btn.dataset.key;
  if (teamShowAll) return;
  revealed.has(k) ? revealed.delete(k) : revealed.add(k);
  store.set("revealed", [...revealed]);
  renderTeam(false);
  render(store.get("lastData", { games: [] }), false);
});
document.getElementById("teamBack").addEventListener("click", closeTeam);
document.getElementById("teamRefresh").addEventListener("click", () => loadTeam(false));

// Show saved schedule instantly, then refresh
const saved = store.get("lastData", null);
if (saved) render(saved, false);
load();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
