<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Game Schedule</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card-2: #222631;
    --text: #f2f3f5;
    --muted: #9aa1ad;
    --line: #2a2f3a;
    --accent: #5aa9ff;
    --live: #ff4d4f;
    --win: #3ccf7a;
    --loss: #ff6b6b;
    --draw: #c9a227;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }

  header {
    position: sticky; top: 0; z-index: 5;
    background: rgba(15,17,21,.92); backdrop-filter: blur(10px);
    padding: 14px 16px 10px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 20px; margin: 0; flex: 1; letter-spacing: .2px; }
  #updated { font-size: 12px; color: var(--muted); margin-top: 2px; font-weight: 400; display: block; }
  #refresh {
    border: 0; background: var(--card-2); color: var(--text);
    width: 40px; height: 40px; border-radius: 12px; font-size: 18px; cursor: pointer;
  }
  #refresh.spin span { display: inline-block; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  main { padding: 6px 12px 32px; max-width: 640px; margin: 0 auto; }
  .day { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px;
    color: var(--muted); margin: 18px 4px 8px; }
  .day.today { color: var(--accent); }

  .game {
    background: var(--card); border-radius: 16px; padding: 14px;
    margin-bottom: 10px; display: grid; grid-template-columns: 48px 1fr auto;
    gap: 4px 12px; align-items: center; border: 1px solid transparent;
  }
  .game.in { border-color: rgba(255,77,79,.5); }
  .logo { width: 48px; height: 48px; border-radius: 12px; background: #fff1;
    display: grid; place-items: center; overflow: hidden; grid-row: span 2; }
  .logo img { width: 40px; height: 40px; object-fit: contain; }
  .logo .fb { font-weight: 800; font-size: 14px; color: var(--muted); }
  .team { font-weight: 700; font-size: 16px; line-height: 1.2; }
  .matchup { color: var(--muted); font-size: 15px; display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .matchup img { width: 18px; height: 18px; object-fit: contain; }
  .time { text-align: right; font-weight: 700; font-size: 16px; white-space: nowrap; grid-row: span 2; align-self: start; }
  .time small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); margin-top: 3px; }
  .meta { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { font-size: 12px; padding: 4px 9px; border-radius: 999px; background: var(--card-2); color: var(--muted); }
  .chip.watch { color: var(--text); }
  .chip.home { color: #8fd3a6; }
  .chip.away { color: #f0b36b; }

  .status { grid-column: 1 / 4; display: flex; align-items: center; gap: 10px;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .badge { font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 8px; background: var(--card-2); }
  .badge.live { background: var(--live); color: #fff; }
  .badge.live::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #fff; margin-right: 6px; vertical-align: 1px; animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .reveal { margin-left: auto; border: 1px dashed #4a5263; background: none; color: var(--muted);
    font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 10px; cursor: pointer; }
  .score { margin-left: auto; font-weight: 800; font-size: 18px; letter-spacing: .5px;
    background: none; border: 0; color: var(--text); cursor: pointer; font-family: inherit; }
  .score .r { font-size: 13px; padding: 2px 7px; border-radius: 6px; margin-left: 8px; vertical-align: 2px; }
  .r.W { background: rgba(60,207,122,.18); color: var(--win); }
  .r.L { background: rgba(255,107,107,.18); color: var(--loss); }
  .r.D { background: rgba(201,162,39,.18); color: var(--draw); }

  .msg { text-align: center; color: var(--muted); padding: 40px 16px; font-size: 15px; }
  .banner { background: #3a2a12; color: #f3c77a; font-size: 13px; padding: 8px 12px;
    border-radius: 10px; margin: 12px 0 0; }
  .hbtn { border: 0; background: var(--card-2); color: var(--text); height: 40px; padding: 0 14px;
    border-radius: 12px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }

  /* ---- Manage teams sheet ---- */
  .sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: none; flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  .sheet.open { display: flex; }
  .sheet-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  .sheet-head h2 { font-size: 20px; margin: 0; flex: 1; }
  .sheet-head .back { background: none; border: 0; color: var(--accent); font: inherit; font-size: 15px; padding: 8px 4px; cursor: pointer; }
  .sheet-head .done { background: var(--accent); color: #fff; }
  .sheet-body { flex: 1; overflow-y: auto; padding: 12px 12px 32px; }
  .trow { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 14px;
    padding: 10px 12px; margin-bottom: 8px; }
  .trow .logo { width: 40px; height: 40px; grid-row: auto; border-radius: 10px; }
  .trow .logo img { width: 32px; height: 32px; }
  .trow .tname { flex: 1; min-width: 0; }
  .trow .tname b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trow .tname small { color: var(--muted); font-size: 12px; }
  .rm { border: 0; background: rgba(255,107,107,.14); color: var(--loss); font: inherit; font-size: 13px;
    font-weight: 600; padding: 8px 12px; border-radius: 10px; cursor: pointer; }
  .add { border: 0; background: rgba(90,169,255,.16); color: var(--accent); font: inherit; font-size: 13px;
    font-weight: 600; padding: 8px 14px; border-radius: 10px; cursor: pointer; }
  .add.added { background: var(--card-2); color: var(--muted); }
  .bigadd { width: 100%; border: 1px dashed #4a5263; background: none; color: var(--accent); font: inherit;
    font-size: 15px; font-weight: 600; padding: 14px; border-radius: 14px; margin-top: 6px; cursor: pointer; }
  .leagues { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 12px; scrollbar-width: none; }
  .leagues::-webkit-scrollbar { display: none; }
  .lchip { flex: none; border: 0; background: var(--card-2); color: var(--muted); font: inherit; font-size: 13px;
    padding: 8px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .lchip.on { background: var(--accent); color: #fff; font-weight: 600; }
  .search { width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); color: var(--text); margin-bottom: 12px; outline: none; }
  .search:focus { border-color: var(--accent); }
  .hint { color: var(--muted); font-size: 13px; margin: 2px 4px 12px; }

  .skeleton { height: 96px; border-radius: 16px; margin-bottom: 10px;
    background: linear-gradient(90deg, var(--card) 0%, var(--card-2) 50%, var(--card) 100%);
    background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
</style>
</head>
<body>
<header>
  <h1>Game Schedule <span id="updated">Loading…</span></h1>
  <button id="teamsBtn" class="hbtn">Teams</button>
  <button id="refresh" aria-label="Refresh"><span>↻</span></button>
</header>
<main id="list">
  <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
</main>

<!-- Manage teams -->
<section id="sheet" class="sheet" aria-modal="true" role="dialog">
  <div class="sheet-head">
    <button id="sheetBack" class="back" hidden>‹ Back</button>
    <h2 id="sheetTitle">My Teams</h2>
    <button id="sheetDone" class="hbtn done">Done</button>
  </div>
  <div id="sheetBody" class="sheet-body"></div>
</section>

<script>
// ===== Settings =====
const API = "https://game-schedule.mrdraco01.workers.dev/";
const REFRESH_MINUTES = 5;
// =====================

const list = document.getElementById("list");
const updatedEl = document.getElementById("updated");
const refreshBtn = document.getElementById("refresh");

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? (JSON.parse(v) ?? d) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let revealed = new Set(store.get("revealed", []));

// ===== My teams (saved on this phone) =====
const logoUrl = (path) => `https://a.espncdn.com/combiner/i?img=/i/teamlogos/${path}.png&h=96&w=96`;
const DEFAULT_TEAMS = [
  { league: "cfb",  id: 252,    name: "BYU Football",       logo: logoUrl("ncaa/500/252") },
  { league: "wsoc", id: 20516,  name: "BYU Women's Soccer", logo: logoUrl("ncaa/500/252") },
  { league: "nhl",  id: 129764, name: "Utah Mammoth",       logo: logoUrl("nhl/500/uta") },
  { league: "nwsl", id: 19141,  name: "Utah Royals",        logo: logoUrl("soccer/500/19141") },
  { league: "mls",  id: 4771,   name: "Real Salt Lake",     logo: logoUrl("soccer/500/4771") },
  { league: "nba",  id: 26,     name: "Utah Jazz",          logo: logoUrl("nba/500/utah") },
];
let myTeams = store.get("myTeams", null) || DEFAULT_TEAMS;
const saveTeams = () => store.set("myTeams", myTeams);
const scheduleUrl = () => API + "?" + myTeams.map((t) => "t=" + encodeURIComponent(`${t.league}~${t.id}~${t.name}`)).join("&");

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const gameKey = (g) => `${g.team}|${g.iso}`;
const initials = (name) => name.split(/\s+/).map((w) => w[0]).join("").slice(0, 3).toUpperCase();

function dayLabel(d) {
  const k = (x) => x.toLocaleDateString("en-CA");
  const now = new Date();
  const tom = new Date(now); tom.setDate(now.getDate() + 1);
  const yest = new Date(now); yest.setDate(now.getDate() - 1);
  if (k(d) === k(now)) return "Today";
  if (k(d) === k(tom)) return "Tomorrow";
  if (k(d) === k(yest)) return "Yesterday";
  return d.toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric" });
}
function timeLabel(g, d) {
  if (g.time === "TBD") return "TBD";
  return d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
}

function render(data, stale) {
  const games = (data && data.games) || [];
  if (!games.length) {
    list.innerHTML = `<div class="msg">No upcoming games found.</div>`;
    return;
  }
  let html = stale ? `<div class="banner">Offline — showing the last schedule saved on this phone.</div>` : "";
  let lastDay = "";
  for (const g of games) {
    const d = new Date(g.iso);
    const day = dayLabel(d);
    if (day !== lastDay) {
      html += `<div class="day ${day === "Today" ? "today" : ""}">${esc(day)}</div>`;
      lastDay = day;
    }
    const key = gameKey(g);
    const ha = (g.homeAway || "").toLowerCase();
    const logo = g.logo
      ? `<img src="${esc(g.logo)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'fb',textContent:'${esc(initials(g.team))}'}))">`
      : `<span class="fb">${esc(initials(g.team))}</span>`;
    const oppLogo = g.oppLogo ? `<img src="${esc(g.oppLogo)}" alt="" loading="lazy" onerror="this.remove()">` : "";

    let status = "";
    if (g.state === "in" || g.state === "post") {
      const badge = g.state === "in"
        ? `<span class="badge live">${esc((g.status || "LIVE").replace(/^LIVE · /, "LIVE "))}</span>`
        : `<span class="badge">${esc(g.status || "Final")}</span>`;
      let right = "";
      if (g.score) {
        right = revealed.has(key)
          ? `<button class="score" data-key="${esc(key)}" aria-label="Hide score">${esc(g.score)}${g.result ? `<span class="r ${esc(g.result)}">${esc(g.result)}</span>` : ""}</button>`
          : `<button class="reveal" data-key="${esc(key)}">Tap to reveal score</button>`;
      }
      status = `<div class="status">${badge}${right}</div>`;
    }

    html += `
      <article class="game ${esc(g.state)}">
        <div class="logo">${logo}</div>
        <div class="team">${esc(g.team)}</div>
        <div class="time">${esc(timeLabel(g, d))}<small>${esc(g.homeAway)}</small></div>
        <div class="matchup">${g.matchup?.startsWith("@") ? "@" : "vs"} ${oppLogo}<span>${esc(g.opponent)}</span></div>
        <div class="meta">
          <span class="chip watch">📺 ${esc(g.watch)}</span>
          <span class="chip ${ha}">${esc(g.homeAway)}</span>
        </div>
        ${status}
      </article>`;
  }
  list.innerHTML = html;
}

function setUpdated(text) { updatedEl.textContent = text; }

async function load() {
  if (!myTeams.length) {
    list.innerHTML = `<div class="msg">No teams yet.<br><br><button class="bigadd" onclick="openSheet()">+ Add a team</button></div>`;
    setUpdated("");
    return;
  }
  refreshBtn.classList.add("spin");
  try {
    const r = await fetch(scheduleUrl(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    store.set("lastData", data);
    // forget revealed scores for games no longer listed
    const keys = new Set(data.games.map(gameKey));
    revealed = new Set([...revealed].filter((k) => keys.has(k)));
    store.set("revealed", [...revealed]);
    render(data, false);
    setUpdated("Updated " + new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }));
  } catch (e) {
    const cached = store.get("lastData", null);
    if (cached) { render(cached, true); setUpdated("Offline"); }
    else { list.innerHTML = `<div class="msg">Couldn't load the schedule. Check your connection and tap ↻.</div>`; setUpdated("Error"); }
  } finally {
    refreshBtn.classList.remove("spin");
  }
}

list.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-key]");
  if (!btn) return;
  const k = btn.dataset.key;
  revealed.has(k) ? revealed.delete(k) : revealed.add(k);
  store.set("revealed", [...revealed]);
  render(store.get("lastData", { games: [] }), false);
});
refreshBtn.addEventListener("click", load);

// ===== Manage teams screen =====
const sheet = document.getElementById("sheet");
const sheetBody = document.getElementById("sheetBody");
const sheetTitle = document.getElementById("sheetTitle");
const sheetBack = document.getElementById("sheetBack");
let leagues = null;          // [{key, name}]
const leagueTeamsCache = {}; // league -> [{id, name, full, logo}]
let currentLeague = store.get("lastLeague", "cfb");
let teamsChanged = false;

const leagueName = (key) => (leagues || []).find((l) => l.key === key)?.name || key.toUpperCase();
const isMine = (league, id) => myTeams.some((t) => t.league === league && Number(t.id) === Number(id));
const logoBox = (t) => `<div class="logo">${t.logo
  ? `<img src="${esc(t.logo)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'fb',textContent:'${esc(initials(t.name))}'}))">`
  : `<span class="fb">${esc(initials(t.name))}</span>`}</div>`;

async function getLeagues() {
  if (leagues) return leagues;
  const r = await fetch(API + "leagues");
  leagues = (await r.json()).leagues;
  return leagues;
}

function openSheet() {
  teamsChanged = false;
  sheet.classList.add("open");
  showMyTeams();
  getLeagues().then(() => { if (sheetTitle.textContent === "My Teams") showMyTeams(); }).catch(() => {});
}
function closeSheet() {
  sheet.classList.remove("open");
  if (teamsChanged) { store.set("lastData", null); list.innerHTML = `<div class="skeleton"></div><div class="skeleton"></div>`; load(); }
}

function showMyTeams() {
  sheetTitle.textContent = "My Teams";
  sheetBack.hidden = true;
  sheetBody.innerHTML = `
    <p class="hint">${myTeams.length} team${myTeams.length === 1 ? "" : "s"} · saved on this phone</p>
    ${myTeams.map((t, i) => `
      <div class="trow">
        ${logoBox(t)}
        <div class="tname"><b>${esc(t.name)}</b><small>${esc(leagueName(t.league))}</small></div>
        <button class="rm" data-remove="${i}">Remove</button>
      </div>`).join("")}
    <button class="bigadd" id="addTeamBtn">+ Add team</button>`;
}

async function showAddTeam() {
  sheetTitle.textContent = "Add Team";
  sheetBack.hidden = false;
  sheetBody.innerHTML = `<div class="skeleton" style="height:40px"></div><div class="skeleton"></div>`;
  try { await getLeagues(); } catch { sheetBody.innerHTML = `<div class="msg">Couldn't load leagues. Check your connection.</div>`; return; }
  sheetBody.innerHTML = `
    <div class="leagues">${leagues.map((l) => `<button class="lchip ${l.key === currentLeague ? "on" : ""}" data-league="${l.key}">${esc(l.name)}</button>`).join("")}</div>
    <input id="teamSearch" class="search" type="search" placeholder="Search teams…" autocomplete="off">
    <div id="results"></div>`;
  sheetBody.querySelector(".lchip.on")?.scrollIntoView({ inline: "center", block: "nearest" });
  document.getElementById("teamSearch").addEventListener("input", renderResults);
  loadLeague(currentLeague);
}

async function loadLeague(key) {
  currentLeague = key; store.set("lastLeague", key);
  sheetBody.querySelectorAll(".lchip").forEach((c) => c.classList.toggle("on", c.dataset.league === key));
  const res = document.getElementById("results");
  if (!leagueTeamsCache[key]) {
    res.innerHTML = `<div class="skeleton"></div><div class="skeleton"></div>`;
    try {
      const r = await fetch(API + "teams?league=" + encodeURIComponent(key));
      leagueTeamsCache[key] = (await r.json()).teams || [];
    } catch { res.innerHTML = `<div class="msg">Couldn't load teams. Check your connection.</div>`; return; }
  }
  if (currentLeague === key) renderResults();
}

function renderResults() {
  const res = document.getElementById("results");
  const all = leagueTeamsCache[currentLeague];
  if (!res || !all) return;
  const q = document.getElementById("teamSearch").value.trim().toLowerCase();
  const matches = all.filter((t) => !q || t.name.toLowerCase().includes(q) || t.full.toLowerCase().includes(q)
    || (t.abbr || "").toLowerCase() === q);
  const shown = matches.slice(0, 60);
  res.innerHTML = shown.map((t) => {
    const mine = isMine(currentLeague, t.id);
    return `<div class="trow">
      ${logoBox(t)}
      <div class="tname"><b>${esc(t.name)}</b><small>${esc(t.full)}</small></div>
      <button class="add ${mine ? "added" : ""}" data-add="${t.id}" ${mine ? "disabled" : ""}>${mine ? "Added ✓" : "Add"}</button>
    </div>`;
  }).join("") + (matches.length > shown.length ? `<p class="hint">Showing ${shown.length} of ${matches.length} — type to narrow it down.</p>` : "")
    + (!matches.length ? `<div class="msg">No teams match "${esc(q)}".</div>` : "");
}

sheet.addEventListener("click", (e) => {
  const rm = e.target.closest("[data-remove]");
  if (rm) { myTeams.splice(Number(rm.dataset.remove), 1); saveTeams(); teamsChanged = true; showMyTeams(); return; }
  if (e.target.closest("#addTeamBtn")) { showAddTeam(); return; }
  const lc = e.target.closest("[data-league]");
  if (lc) { loadLeague(lc.dataset.league); return; }
  const add = e.target.closest("[data-add]");
  if (add) {
    const t = leagueTeamsCache[currentLeague].find((x) => String(x.id) === add.dataset.add);
    if (t && !isMine(currentLeague, t.id)) {
      myTeams.push({ league: currentLeague, id: t.id, name: t.name, logo: t.logo });
      saveTeams(); teamsChanged = true;
      add.textContent = "Added ✓"; add.classList.add("added"); add.disabled = true;
    }
  }
});
sheetBack.addEventListener("click", showMyTeams);
document.getElementById("sheetDone").addEventListener("click", closeSheet);
document.getElementById("teamsBtn").addEventListener("click", openSheet);
window.openSheet = openSheet;
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
setInterval(() => { if (!document.hidden) load(); }, REFRESH_MINUTES * 60e3);

// Show saved schedule instantly, then refresh
const saved = store.get("lastData", null);
if (saved) render(saved, false);
load();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
