<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Game Schedule</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card-2: #222631;
    --text: #f2f3f5;
    --muted: #9aa1ad;
    --line: #2a2f3a;
    --accent: #5aa9ff;
    --live: #ff4d4f;
    --win: #3ccf7a;
    --loss: #ff6b6b;
    --draw: #c9a227;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }

  header {
    position: sticky; top: 0; z-index: 5;
    background: rgba(15,17,21,.92); backdrop-filter: blur(10px);
    padding: 14px 16px 10px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 20px; margin: 0; flex: 1; letter-spacing: .2px; }
  #updated { font-size: 12px; color: var(--muted); margin-top: 2px; font-weight: 400; display: block; }
  #refresh {
    border: 0; background: var(--card-2); color: var(--text);
    width: 40px; height: 40px; border-radius: 12px; font-size: 18px; cursor: pointer;
  }
  #refresh.spin span { display: inline-block; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  main { padding: 6px 12px 32px; max-width: 640px; margin: 0 auto; }
  .day { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px;
    color: var(--muted); margin: 18px 4px 8px; }
  .day.today { color: var(--accent); }

  .game {
    background: var(--card); border-radius: 16px; padding: 14px;
    margin-bottom: 10px; display: grid; grid-template-columns: 48px 1fr auto;
    gap: 4px 12px; align-items: center; border: 1px solid transparent;
  }
  .game.in { border-color: rgba(255,77,79,.5); }
  .logo { width: 48px; height: 48px; border-radius: 12px; background: #fff1;
    display: grid; place-items: center; overflow: hidden; grid-row: span 2; }
  .logo img { width: 40px; height: 40px; object-fit: contain; }
  .logo .fb { font-weight: 800; font-size: 14px; color: var(--muted); }
  .team { font-weight: 700; font-size: 16px; line-height: 1.2; }
  .matchup { color: var(--muted); font-size: 15px; display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .matchup img { width: 18px; height: 18px; object-fit: contain; }
  .time { text-align: right; font-weight: 700; font-size: 16px; white-space: nowrap; grid-row: span 2; align-self: start; }
  .time small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); margin-top: 3px; }
  .meta { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { font-size: 12px; padding: 4px 9px; border-radius: 999px; background: var(--card-2); color: var(--muted); }
  .chip.watch { color: var(--text); }
  .chip.home { color: #8fd3a6; }
  .chip.away { color: #f0b36b; }

  .status { grid-column: 1 / 4; display: flex; align-items: center; gap: 10px;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .badge { font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 8px; background: var(--card-2); }
  .badge.live { background: var(--live); color: #fff; }
  .badge.live::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #fff; margin-right: 6px; vertical-align: 1px; animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .reveal { margin-left: auto; border: 1px dashed #4a5263; background: none; color: var(--muted);
    font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 10px; cursor: pointer; }
  .score { margin-left: auto; font-weight: 800; font-size: 18px; letter-spacing: .5px;
    background: none; border: 0; color: var(--text); cursor: pointer; font-family: inherit; }
  .score .r { font-size: 13px; padding: 2px 7px; border-radius: 6px; margin-left: 8px; vertical-align: 2px; }
  .r.W { background: rgba(60,207,122,.18); color: var(--win); }
  .r.L { background: rgba(255,107,107,.18); color: var(--loss); }
  .r.D { background: rgba(201,162,39,.18); color: var(--draw); }

  .msg { text-align: center; color: var(--muted); padding: 40px 16px; font-size: 15px; }
  .banner { background: #3a2a12; color: #f3c77a; font-size: 13px; padding: 8px 12px;
    border-radius: 10px; margin: 12px 0 0; }
  .skeleton { height: 96px; border-radius: 16px; margin-bottom: 10px;
    background: linear-gradient(90deg, var(--card) 0%, var(--card-2) 50%, var(--card) 100%);
    background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
</style>
</head>
<body>
<header>
  <h1>Game Schedule <span id="updated">Loading…</span></h1>
  <button id="refresh" aria-label="Refresh"><span>↻</span></button>
</header>
<main id="list">
  <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
</main>

<script>
// ===== Settings =====
const API = "https://game-schedule.mrdraco01.workers.dev/";
const REFRESH_MINUTES = 5;
// =====================

const list = document.getElementById("list");
const updatedEl = document.getElementById("updated");
const refreshBtn = document.getElementById("refresh");

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let revealed = new Set(store.get("revealed", []));

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const gameKey = (g) => `${g.team}|${g.iso}`;
const initials = (name) => name.split(/\s+/).map((w) => w[0]).join("").slice(0, 3).toUpperCase();

function dayLabel(d) {
  const k = (x) => x.toLocaleDateString("en-CA");
  const now = new Date();
  const tom = new Date(now); tom.setDate(now.getDate() + 1);
  const yest = new Date(now); yest.setDate(now.getDate() - 1);
  if (k(d) === k(now)) return "Today";
  if (k(d) === k(tom)) return "Tomorrow";
  if (k(d) === k(yest)) return "Yesterday";
  return d.toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric" });
}
function timeLabel(g, d) {
  if (g.time === "TBD") return "TBD";
  return d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
}

function render(data, stale) {
  const games = (data && data.games) || [];
  if (!games.length) {
    list.innerHTML = `<div class="msg">No upcoming games found.</div>`;
    return;
  }
  let html = stale ? `<div class="banner">Offline — showing the last schedule saved on this phone.</div>` : "";
  let lastDay = "";
  for (const g of games) {
    const d = new Date(g.iso);
    const day = dayLabel(d);
    if (day !== lastDay) {
      html += `<div class="day ${day === "Today" ? "today" : ""}">${esc(day)}</div>`;
      lastDay = day;
    }
    const key = gameKey(g);
    const ha = (g.homeAway || "").toLowerCase();
    const logo = g.logo
      ? `<img src="${esc(g.logo)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'fb',textContent:'${esc(initials(g.team))}'}))">`
      : `<span class="fb">${esc(initials(g.team))}</span>`;
    const oppLogo = g.oppLogo ? `<img src="${esc(g.oppLogo)}" alt="" loading="lazy" onerror="this.remove()">` : "";

    let status = "";
    if (g.state === "in" || g.state === "post") {
      const badge = g.state === "in"
        ? `<span class="badge live">${esc((g.status || "LIVE").replace(/^LIVE · /, "LIVE "))}</span>`
        : `<span class="badge">${esc(g.status || "Final")}</span>`;
      let right = "";
      if (g.score) {
        right = revealed.has(key)
          ? `<button class="score" data-key="${esc(key)}" aria-label="Hide score">${esc(g.score)}${g.result ? `<span class="r ${esc(g.result)}">${esc(g.result)}</span>` : ""}</button>`
          : `<button class="reveal" data-key="${esc(key)}">Tap to reveal score</button>`;
      }
      status = `<div class="status">${badge}${right}</div>`;
    }

    html += `
      <article class="game ${esc(g.state)}">
        <div class="logo">${logo}</div>
        <div class="team">${esc(g.team)}</div>
        <div class="time">${esc(timeLabel(g, d))}<small>${esc(g.homeAway)}</small></div>
        <div class="matchup">${g.matchup?.startsWith("@") ? "@" : "vs"} ${oppLogo}<span>${esc(g.opponent)}</span></div>
        <div class="meta">
          <span class="chip watch">📺 ${esc(g.watch)}</span>
          <span class="chip ${ha}">${esc(g.homeAway)}</span>
        </div>
        ${status}
      </article>`;
  }
  list.innerHTML = html;
}

function setUpdated(text) { updatedEl.textContent = text; }

async function load() {
  refreshBtn.classList.add("spin");
  try {
    const r = await fetch(API, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    store.set("lastData", data);
    // forget revealed scores for games no longer listed
    const keys = new Set(data.games.map(gameKey));
    revealed = new Set([...revealed].filter((k) => keys.has(k)));
    store.set("revealed", [...revealed]);
    render(data, false);
    setUpdated("Updated " + new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }));
  } catch (e) {
    const cached = store.get("lastData", null);
    if (cached) { render(cached, true); setUpdated("Offline"); }
    else { list.innerHTML = `<div class="msg">Couldn't load the schedule. Check your connection and tap ↻.</div>`; setUpdated("Error"); }
  } finally {
    refreshBtn.classList.remove("spin");
  }
}

list.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-key]");
  if (!btn) return;
  const k = btn.dataset.key;
  revealed.has(k) ? revealed.delete(k) : revealed.add(k);
  store.set("revealed", [...revealed]);
  render(store.get("lastData", { games: [] }), false);
});
refreshBtn.addEventListener("click", load);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
setInterval(() => { if (!document.hidden) load(); }, REFRESH_MINUTES * 60e3);

// Show saved schedule instantly, then refresh
const saved = store.get("lastData", null);
if (saved) render(saved, false);
load();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
